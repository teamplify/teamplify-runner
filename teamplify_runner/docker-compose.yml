# Stops the backend while the DB or Redis is recreated, so that it doesn't fail
# against them, and starts it again afterwards
x-stateful-dependencies: &stateful-dependencies
  builtin_db:
    condition: service_started
    restart: true
  redis:
    condition: service_started
    restart: true

x-app-base: &app-base
  image: ${IMAGE_APP}
  depends_on:
    <<: *stateful-dependencies
  links:
    - builtin_db
    - redis
  volumes:
    - media:/media/
  environment:
    # nginx-proxy & Let's Encrypt configuration:
    - VIRTUAL_HOST
    - VIRTUAL_PORT=8211
    - VIRTUAL_PROTO=uwsgi
    - LETSENCRYPT_HOST=${LETSENCRYPT_HOST}
    - HSTS=off

    - MAIN_PRODUCT_KEY
    - MAIN_UPDATE_CHANNEL
    - MAIN_SEND_CRASH_REPORTS
    - MAIN_BYPASS_EMAIL_CONFIRMATION
    - WEB_HOST
    - WEB_PORT
    - WEB_SSL_PORT
    - DB_HOST
    - DB_PORT
    - DB_USER
    - DB_PASSWORD
    - EMAIL_ADDRESS_FROM
    - EMAIL_SMTP_HOST
    - EMAIL_SMTP_PROTOCOL
    - EMAIL_SMTP_PORT
    - EMAIL_SMTP_USER
    - EMAIL_SMTP_PASSWORD
    - CRYPTO_SIGNING_KEY
  restart: always

services:

  builtin_db:
    image: ${IMAGE_DB}
    container_name: teamplify_db
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql/
      - ${DB_BACKUP_MOUNT}:/backup/
      - ./mysql.cnf:/etc/mysql/conf.d/teamplify.cnf:ro
    labels:
      - teamplify.config-hash=${MYSQL_CONFIG_HASH}
    restart: always

  redis:
    image: ${IMAGE_REDIS}
    container_name: teamplify_redis
    volumes:
      - ./redis.conf:/etc/redis/redis.conf:ro
    labels:
      - teamplify.config-hash=${REDIS_CONFIG_HASH}
    restart: always
    command: redis-server /etc/redis/redis.conf

  nginx:
    &nginx
    image: ${IMAGE_NGINX}
    container_name: teamplify_nginx
    depends_on:
      - app
    volumes:
      - ${WEB_SSL_CERTS:-nginx_certs}:/etc/nginx/certs:ro
      - nginx_dhparam:/etc/nginx/dhparam
      - /etc/nginx/vhost.d
      - /usr/share/nginx/html
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./vhost.conf:/etc/nginx/vhost.d/${WEB_HOST}:ro
      # entry verbatim, so the wildcard vhost needs its own copy.
      - ./vhost.conf:/etc/nginx/vhost.d/*.${WEB_HOST}:ro
      - ./uwsgi_params.conf:/etc/nginx/uwsgi_params:ro
    labels:
      - teamplify.config-hash=${NGINX_CONFIG_HASH}
    volumes_from:
      - app:ro
    environment:
      - HTTPS_METHOD
      - HTTPS_PORT
      - HTTP_PORT=${WEB_PORT}
      - TRUST_DOWNSTREAM_PROXY=true
      # Mitigates the nginx2root HTTP/2 vulnerabilities until nginx-proxy ships nginx >= 1.31.9.
      # DEFAULT_HOST replaces the fallback server, which enables HTTP/2 regardless of ENABLE_HTTP2.
      - ENABLE_HTTP2=false
      - DEFAULT_HOST=${WEB_HOST}
    ports:
      - ${WEB_PORT}:${WEB_PORT}
    restart: always
    entrypoint: bash -c "find /etc/nginx/dhparam/dhparam.pem -empty -delete || true && /app/docker-entrypoint.sh forego start -r"
    profiles:
      - nossl

  nginx-ssl:
    <<: *nginx
    environment:
      - HTTPS_METHOD
      - HTTPS_PORT
      - HTTP_PORT=${WEB_PORT}
      - TRUST_DOWNSTREAM_PROXY=true
      # Mitigates the nginx2root HTTP/2 vulnerabilities until nginx-proxy ships nginx >= 1.31.9.
      # DEFAULT_HOST replaces the fallback server, which enables HTTP/2 regardless of ENABLE_HTTP2.
      - ENABLE_HTTP2=false
      - DEFAULT_HOST=${WEB_HOST}
    ports:
      - ${WEB_PORT}:${WEB_PORT}
      - ${HTTPS_PORT}:${HTTPS_PORT}
    profiles:
      - ssl

  letsencrypt:
    image: ${IMAGE_LETSENCRYPT}
    container_name: teamplify_letsencrypt
    depends_on:
      - nginx-ssl
    environment:
      - VIRTUAL_HOST=${WEB_HOST}
      - LETSENCRYPT_HOST
      - ACME_CHALLENGE
      - ACMESH_DNS_API_CONFIG
    volumes:
      - nginx_certs:/etc/nginx/certs
      - /var/run/docker.sock:/var/run/docker.sock:ro
    volumes_from:
      - nginx-ssl
    profiles:
      - letsencrypt

  acme_dns:
    image: ${IMAGE_ACME_DNS}
    container_name: teamplify_acme_dns
    # The runner generates the configuration and passes it in the environment,
    # so that nothing has to be written on the host
    entrypoint: sh -c 'printf "%s\n" "$$ACME_DNS_CONFIG" > /etc/acme-dns/config.cfg && exec acme-dns'
    environment:
      - ACME_DNS_CONFIG
    volumes:
      # the database and the credentials of the runner: losing them means that
      # the _acme-challenge CNAME record has to be changed
      - acme_dns:/var/lib/acme-dns
    ports:
      - 53:53/udp
      - 53:53/tcp
    networks:
      default:
        aliases:
          # a hostname without underscores for the API URL
          - acme-dns
    restart: always
    profiles:
      - acme-dns

  builtin_smtp:
    image: ${IMAGE_SMTP}
    container_name: teamplify_smtp
    environment:
      - ENABLE_CLAMAV
      - POSTMASTER_EMAIL
      - POSTFIX_MYNETWORKS
      - POSTFIX_MYHOSTNAME
    restart: always

  app:
    <<: *app-base
    container_name: teamplify_app
    command: /code/server/app.sh

  app_replica:
    <<: *app-base
    command: /code/server/app_replica.sh

  worker_slim: &worker
    image: ${IMAGE_APP}
    depends_on:
      <<: *stateful-dependencies
      app:
        condition: service_started
      builtin_smtp:
        condition: service_started
    links:
      - builtin_db
      - redis
      - builtin_smtp
    volumes:
      - media:/media/
    environment:
      - C_FORCE_ROOT=1
      - MAIN_PRODUCT_KEY
      - MAIN_UPDATE_CHANNEL
      - MAIN_SEND_CRASH_REPORTS
      - WEB_HOST
      - WEB_PORT
      - WEB_SSL_PORT
      - DB_HOST
      - DB_PORT
      - DB_USER
      - DB_PASSWORD
      - EMAIL_ADDRESS_FROM
      - EMAIL_SMTP_HOST
      - EMAIL_SMTP_PROTOCOL
      - EMAIL_SMTP_PORT
      - EMAIL_SMTP_USER
      - EMAIL_SMTP_PASSWORD
      - CRYPTO_SIGNING_KEY
    command: /code/server/worker-slim.sh
    restart: always

  worker_fat:
    <<: *worker
    command: /code/server/worker-fat.sh --without-penalized

  worker_fat_penalized:
    <<: *worker
    command: /code/server/worker-fat.sh

  beat:
    <<: *worker
    container_name: teamplify_beat
    environment:
      - C_FORCE_ROOT=0
    command: /code/server/beat.sh

volumes:
  nginx_certs:
  nginx_dhparam:
  media:
  mysql_data:
  acme_dns:
