gzip on;

location /.well-known/acme-challenge/ {
    default_type "text/plain";
    root /usr/share/nginx/html/;
}

location /media/ {
    alias   /media/;
}

location /static/ {
    alias   /static/;
    # Child workspaces on subdomains load static assets from the main host;
    # module scripts and fonts from another origin require CORS.
    add_header Access-Control-Allow-Origin *;
}

location = /favicon.ico {
    empty_gif;
    access_log off;
}

error_page  404              /404.html;
location = /404.html {
    root   /static;
}

error_page   500  /500.html;
location = /500.html {
    root   /static;
}

error_page   502 503 504  /502.html;
location = /502.html {
    root   /static;
}
